[project]
name = "lobster"
version = "0.1.0"
description = "Always-on AI assistant with Telegram/Slack integration"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.26.0",
    "httpx==0.28.1",
    "watchdog==6.0.0",
    "psutil==7.2.2",
    "python-telegram-bot==22.6",
    "python-dotenv==1.2.1",
    "starlette==0.52.1",
    "uvicorn==0.41.0",
    "sqlite-vec==0.1.7a10",
    "fastembed==0.7.4",
    "twilio==9.10.3",
    "websockets==16.0",
    "cryptography==46.0.5",
]

[project.optional-dependencies]
dashboard = [
    # websockets moved to core deps (required by python-telegram-bot)
]
windows = [
    # zoneinfo (stdlib, Python 3.9+) needs this package on Windows
    # because Windows ships without the IANA timezone database.
    # Linux and macOS use the system tzdata and do not need this.
    "tzdata==2026.1",
]
browser = [
    "playwright==1.58.0",
]
slack = [
    "slack-sdk==3.40.1",
    "slack-bolt==1.27.0",
]
test = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-timeout==2.4.0",
    "pytest-cov==7.0.0",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.uv]
override-dependencies = [
    "pillow==12.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
]
