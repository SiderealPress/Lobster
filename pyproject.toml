[project]
name = "lobster"
version = "0.1.0"
description = "Always-on Claude Code agent with messaging integrations"
requires-python = ">=3.10"
dependencies = [
    # MCP server
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "watchdog>=3.0.0",
    "psutil>=5.9.0",

    # Telegram bot
    "python-telegram-bot>=20.7",

    # HTTP bridge (optional but included)
    "starlette>=0.36.0",
    "uvicorn>=0.27.0",

    # Memory system
    "sqlite-vec>=0.1.1",
    "fastembed>=0.3.0",

    # Nightly consolidation
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
# Headless browser for JS-heavy pages
browser = ["playwright>=1.40.0"]

# Slack integration
slack = ["slack-sdk>=3.27.0"]

test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.2.0",
    "pytest-cov>=4.1.0",
    "aiohttp>=3.9.0",
    "aiofiles>=23.2.0",
    "docker>=7.0.0",
    "aioresponses>=0.7.6",
    "responses>=0.24.0",
    "faker>=22.0.0",
    "freezegun>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
timeout = 60
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "stress: marks tests as stress tests",
    "docker: marks tests requiring Docker",
]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp", "src/bot"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
