# IFTTT-style behavioral rules — managed autonomously by Lobster.
#
# Schema: version 1
#
# Each rule has:
#   id:               Stable unique slug (snake_case, e.g. "check-calendar-on-meeting").
#                     Never reuse a deleted rule's ID.
#   trigger:          Natural-language "if" condition (one sentence).
#   action:           Natural-language "then" action (one sentence).
#   created_at:       ISO 8601 UTC timestamp when the rule was created.
#   last_accessed_at: ISO 8601 UTC timestamp when the rule was last matched/used.
#   access_count:     Total number of times this rule has been applied.
#   source:           Who created the rule: "lobster" | "user" | "system".
#   enabled:          true = active, false = soft-disabled (kept for LRU purposes, never applied).
#   notes:            Optional human-readable annotation or rationale. May be null.
#
# Cap: 100 rules maximum. Least-recently-used rules are pruned automatically
# when the cap is exceeded. The user does not need to manage this file manually.
#
# This file is committed to lobster-user-config and survives machine migrations.

version: 1
rules: []
